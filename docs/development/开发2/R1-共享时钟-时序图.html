<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R1 共享时钟 · 一轮推进</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif TC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }

    p.sub {
      font-family: var(--font-sans);
      color: var(--color-muted);
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · develop2 / R1</p>
    <h1>R1 · 共享时钟驱动一轮推进</h1>
    <p class="sub">开发2：GameLoop 逐刻调用 RoundClock.advance()，生成不可变 TickContext 供 actor 只读，一轮结束返回 ROUND_END。</p>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="r1-round-clock-title r1-round-clock-desc">
      <title id="r1-round-clock-title">R1 shared clock driving one round</title>
      <desc id="r1-round-clock-desc">Sequence diagram of the game loop stepping the RoundClock through one round: transition to READY and PLAYING, a loop of advance() calls producing a shared immutable TickContext snapshot read by actors, ending with the ROUND_END signal before the round boundary.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES -->
      <line x1="120" y1="128" x2="120" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="128" x2="360" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="620" y1="128" x2="620" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="860" y1="128" x2="860" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- LOOP FRAME (one combined fragment) -->
      <rect x="96" y="216" width="824" height="196" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="96" y="216" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="116" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="108" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[每逻辑刻 0 → D-1]</text>

      <!-- ACTIVATION BAR (RoundClock holds control for the round) -->
      <rect x="356" y="156" width="8" height="288" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- MESSAGE ARROWS -->
      <line x1="120" y1="156" x2="360" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="120" y1="192" x2="360" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="120" y1="268" x2="360" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 364 300 L 400 300 L 400 316 L 364 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="332" x2="620" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="364" x2="860" y2="364" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="360" y1="396" x2="120" y2="396" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="360" y1="444" x2="120" y2="444" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- MESSAGE LABELS (opaque masks) -->
      <rect x="204" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READY</text>

      <rect x="200" y="172" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYING</text>

      <rect x="196" y="248" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">advance()</text>

      <rect x="412" y="292" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">roundTick++</text>

      <rect x="446" y="312" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">snapshot()</text>

      <rect x="696" y="344" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ CTX</text>

      <rect x="196" y="376" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="386" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADVANCED</text>

      <rect x="188" y="424" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="434" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUND_END</text>

      <!-- BOUNDARY NOTE -->
      <text x="120" y="484" fill="#7a8399" font-size="12" font-family="'Geist', 'Microsoft YaHei', sans-serif">round&lt;max → RESETTING→READY（下一轮） · round==max → FAILED</text>

      <!-- ACTOR BOXES -->
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#ffffff"/>
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="56" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="74" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GameLoop</text>
      <text x="120" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">develop1 · fixed</text>

      <rect x="288" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="296" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="314" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLK</text>
      <text x="360" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RoundClock</text>
      <text x="360" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">develop2 · tick</text>

      <rect x="548" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="556" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="574" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="620" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TickContext</text>
      <text x="620" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">develop2 · snapshot</text>

      <rect x="788" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="788" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="796" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="814" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACT</text>
      <text x="860" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actor</text>
      <text x="860" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">player / echo</text>

      <!-- LEGEND -->
      <line x1="48" y1="528" x2="944" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="48" y1="564" x2="76" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="84" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="176" y1="564" x2="204" y2="564" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="212" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <rect x="300" y="556" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="320" y="567" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="348" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fragment</text>

      <rect x="456" y="556" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="478" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

      <line x1="576" y1="564" x2="604" y2="564" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="612" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline signal</text>

    </svg>
  </div>
</body>
</html>
